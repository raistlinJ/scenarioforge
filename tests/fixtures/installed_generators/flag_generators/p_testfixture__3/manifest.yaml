manifest_version: 1
id: testfix_flag_charlie
kind: flag-generator
name: 'Fixture: Flag Charlie'
description: Deterministic fixture flag-generator.
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
outputs:
- name: Flag(flag_id)
  required: false
hint_levels:
  low:
  - 'Next: {{NEXT_NODE_NAME}}'
  medium:
  - Look on {{NEXT_NODE_NAME}} at {{NEXT_NODE_IP}}
  high:
  - The flag is staged on {{NEXT_NODE_NAME}} ({{NEXT_NODE_IP}})
hint_template: 'Next: {{NEXT_NODE_NAME}}'
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
